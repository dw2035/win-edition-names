name: validate

on:
  push:
    paths:
      - 'data/**'
      - 'build/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON (schema + duplicates + key-leak guard)
        shell: pwsh
        run: ./build/validate.ps1

      - name: Check checksum files are up to date
        shell: bash
        run: |
          set -e
          for f in data/products.json data/office-skus.json; do
            expected=$(cut -d' ' -f1 "$f.sha256")
            actual=$(sha256sum "$f" | cut -d' ' -f1)
            echo "$f expected: $expected"
            echo "$f actual  : $actual"
            if [ "$expected" != "$actual" ]; then
              echo "::error::$f.sha256 is stale. Run build/validate.ps1 and commit the result."
              exit 1
            fi
          done

      - name: Verify JSON is parseable by a generic parser
        shell: bash
        run: |
          python3 - <<'PY'
          import json, io
          for path, node in (('data/products.json', 'editions'), ('data/office-skus.json', 'products')):
              with io.open(path, encoding='utf-8') as fh:
                  doc = json.load(fh)
              print(path, node, len(doc[node]))
          PY
